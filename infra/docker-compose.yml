# Local development services. Start with: pnpm infra:up
name: yucampus

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yucampus
      POSTGRES_PASSWORD: yucampus
      POSTGRES_DB: yucampus
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yucampus -d yucampus']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development only (SeaweedFS; MinIO no longer publishes free
  # images). The API talks to it through the S3 API, exactly as it will talk to AWS S3 or any other provider.
  # Local credentials only: yucampus / yucampus-local-secret. The API creates the bucket on first start.
  storage:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports: ['9000:8333']
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  # Test inbox for local development: every email the app sends lands here instead of a real inbox.
  # Read them at http://localhost:8025
  mail:
    image: axllent/mailpit:v1.31.3
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres-data:
  storage-data:
