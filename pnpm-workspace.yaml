packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - zod@4.6.7
  - '@nestjs/common@12.1.3'
  - '@nestjs/core@12.1.3'
  - '@nestjs/platform-express@12.1.3'
  - '@electric-sql/pglite@0.5.9'

# Only these dependencies may run install scripts.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@scarf/scarf': false
  # Optional native speed-up for the job queue; the plain JavaScript version is used without it.
  msgpackr-extract: false
