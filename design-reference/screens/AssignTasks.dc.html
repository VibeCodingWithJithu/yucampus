<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YuCampus · Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#2B3990}a:hover{color:#1E2870}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F5F6FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #121733">
<div style="flex: 1 1 240px; background: #FFFFFF; border-right: 1px solid #E3E6EF">
<dc-import name="Sidebar" active="Tasks" hint-size="100%,860px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<nav aria-label="Breadcrumb" style="font-size: 13px; color: #545B73"><a href="Main.dc.html" style="text-decoration: none">Dashboard</a> / Tasks</nav>
<h1 style="margin: 6px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Tasks</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: #545B73">Give work to departments and faculty. Reminders go out automatically.</p>
</div>
</header>

<section aria-labelledby="tpl-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="tpl-h" style="margin: 0; font-size: 17px; font-weight: 700"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; vertical-align: middle; box-shadow: 0 0 0 3px #FFE1D2">1</span></sc-if>Start from a ready-made template</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{templates}}" as="t" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E3E6EF; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 13px; color: #545B73">{{t.info}}</span>
<button type="button" style="margin-top: auto; height: 40px; border: 1px solid #E3E6EF; border-radius: 8px; background: #FFFFFF; color: #2B3990; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Use this template</button>
</div>
</sc-for>
</div>
</section>

<section aria-labelledby="new-h" style="background: #FFFFFF; border: 1px solid #E3E6EF; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 id="new-h" style="margin: 0; font-size: 17px; font-weight: 700"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; vertical-align: middle; box-shadow: 0 0 0 3px #FFE1D2">2</span></sc-if>Create a task</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; align-items: end">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545B73">What needs to be done
<input type="text" value="{{fTitle}}" onChange="{{onTitle}}" placeholder="e.g. Upload 2025 journal papers" style="height: 44px; padding: 0 12px; border: 1px solid #E3E6EF; border-radius: 8px; font: inherit; font-size: 14px; color: #121733">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545B73">Linked to
<select style="height: 44px; padding: 0 12px; border: 1px solid #E3E6EF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #121733"><option>NAAC C3 · Research papers per teacher</option><option>NBA C5 · Faculty contributions</option><option>NIRF RP · Publications</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545B73">Assign to
<select style="height: 44px; padding: 0 12px; border: 1px solid #E3E6EF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #121733"><option>All CSE faculty</option><option>HOD, ECE</option><option>Research cell</option><option>Dr. K. Rao</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545B73">Due date
<input type="text" value="31 Oct 2026" style="height: 44px; padding: 0 12px; border: 1px solid #E3E6EF; border-radius: 8px; font: inherit; font-size: 14px; color: #121733">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545B73">Repeat
<select style="height: 44px; padding: 0 12px; border: 1px solid #E3E6EF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #121733"><option>Every academic year</option><option>Every semester</option><option>Every month</option><option>Only once</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545B73">Reminders
<select style="height: 44px; padding: 0 12px; border: 1px solid #E3E6EF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #121733"><option>3 days before and on due date</option><option>1 week before</option><option>Daily when overdue</option></select>
</label>
</div>
<div style="display: flex; justify-content: flex-end">
<button type="button" onClick="{{addTask}}" style="height: 44px; padding: 0 20px; border: none; border-radius: 8px; background: #2B3990; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Create and notify</button>
</div>
</section>

<section aria-label="Overdue tasks" style="background: #FBE4E2; border-radius: 12px; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 14px; font-weight: 600; color: #8F1D17; display: flex; align-items: center; gap: 10px"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; flex: none; box-shadow: 0 0 0 3px #FFE1D2">3</span></sc-if>3 tasks are overdue</span>
<button type="button" style="height: 40px; padding: 0 16px; border: none; border-radius: 8px; background: #8F1D17; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Remind everyone now</button>
</section>

<section aria-labelledby="board-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="board-h" style="margin: 0; font-size: 17px; font-weight: 700"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; vertical-align: middle; box-shadow: 0 0 0 3px #FFE1D2">4</span></sc-if>Task board</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; align-items: start">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="4">
<div style="background: #EEF0F4; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px"><span style="font-size: 14px; font-weight: 700">{{col.name}}</span><span style="font-size: 12px; font-weight: 700; color: #545B73">{{col.count}}</span></div>
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
<div style="background: #FFFFFF; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #E3E6EF">
<span style="font-size: 11px; font-weight: 700; color: #2B3990; letter-spacing: 0.03em">{{c.tag}}</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.35">{{c.title}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 12px; color: #545B73">{{c.who}}</span>
<span style="font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; color: {{c.fg}}; background: {{c.bg}}">{{c.due}}</span>
</div>
</div>
</sc-for>
</div>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"guide":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      fTitle: '',
      todo: [
        { tag: 'NAAC C3', title: 'Upload 2025 journal papers', who: 'All CSE faculty', due: '31 Oct', kind: 'due' },
        { tag: 'NAAC C5', title: 'Add higher studies admissions', who: 'Placement cell', due: 'Overdue', kind: 'late' }
      ]
    };
  }
  renderVals() {
    const K = { due: ['#545B73', '#EEF0F4'], late: ['#8F1D17', '#FBE4E2'], done: ['#0B5852', '#DDF1EE'] };
    const card = (c) => ({ ...c, fg: K[c.kind][0], bg: K[c.kind][1] });
    const data = [
      ['To do', this.state.todo],
      ['In progress', [
        { tag: 'NBA C5', title: 'Faculty FDP certificates 2025–26', who: 'HOD, ECE', due: '5 Nov', kind: 'due' },
        { tag: 'NAAC C7', title: 'Gender equity programme reports', who: 'Women cell', due: 'Overdue', kind: 'late' }
      ]],
      ['Submitted', [
        { tag: 'NIRF GO', title: 'Placement data with offer letters', who: 'Placement cell', due: 'Overdue', kind: 'late' },
        { tag: 'NAAC C2', title: 'Mentor–mentee records', who: 'All HODs', due: '12 Oct', kind: 'due' }
      ]],
      ['Approved', [
        { tag: 'NAAC C1', title: 'Feedback analysis report', who: 'IQAC', due: 'Done', kind: 'done' },
        { tag: 'NBA C3', title: 'CO–PO mapping, semester V', who: 'CSE faculty', due: 'Done', kind: 'done' }
      ]]
    ];
    const cols = data.map(([name, cards]) => ({ name, count: cards.length, cards: cards.map(card) }));
    const templates = [
      { name: 'NAAC AQAR yearly pack', info: '42 tasks across all departments' },
      { name: 'NBA SAR pack · B.Tech', info: '36 tasks per program' },
      { name: 'NIRF data pack', info: '28 tasks for offices and cells' },
      { name: 'Monthly department upload', info: '6 recurring tasks per HOD' }
    ];
    return {
      guide: !!this.props.guide, cols, templates,
      fTitle: this.state.fTitle,
      onTitle: (e) => this.setState({ fTitle: e.target.value }),
      addTask: () => {
        const t = this.state.fTitle.trim();
        if (!t) return;
        this.setState({ fTitle: '', todo: [{ tag: 'NAAC C3', title: t, who: 'All CSE faculty', due: '31 Oct', kind: 'due' }].concat(this.state.todo) });
      }
    };
  }
}
</script>
</body>
</html>
