<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YuCampus · Faculty mobile home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#2B3990}a:hover{color:#1E2870}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #121733; display: flex; flex-direction: column">
<div style="flex: 1; overflow: hidden; padding: 20px 20px 110px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px">
<div aria-label="YuCampus logo" style="width: 32px; height: 32px; border-radius: 8px; background: #2B3990; display: flex; align-items: center; justify-content: center; flex: none"><svg width="23" height="23" viewBox="0 0 96 96" aria-hidden="true"><path d="M10 40 L48 12 L86 40" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="M28 44 L48 64 L68 44 M48 64 V86" fill="none" stroke="#5ED1C4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<span style="font-weight: 800; font-size: 16px; letter-spacing: -0.01em"><span style="color: #0E7068">Yu</span>Campus</span>
</div>
<button type="button" aria-label="Notifications, 2 new" style="position: relative; width: 44px; height: 44px; border: 1px solid #E3E6EF; border-radius: 12px; background: #FFFFFF; color: #121733; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #B3261E"></span>
</button>
</header>

<div>
<h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Hi, Dr. K. Rao</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #545B73">CSE · 3 tasks waiting for you</p>
</div>

<section aria-label="Your contribution" style="background: #2B3990; color: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; font-weight: 500; color: #DDE1F5; display: flex; align-items: center; gap: 8px"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; flex: none; box-shadow: 0 0 0 3px #FFE1D2">1</span></sc-if>Your contribution · AY 2025–26</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 700">18</span><span style="font-size: 12px; color: #DDE1F5">Uploaded</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 700">15</span><span style="font-size: 12px; color: #DDE1F5">Approved</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 24px; font-weight: 700">3</span><span style="font-size: 12px; color: #DDE1F5">In review</span></div>
</div>
</section>

<section aria-labelledby="tasks-h" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="tasks-h" style="margin: 0; font-size: 16px; font-weight: 700"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; vertical-align: middle; box-shadow: 0 0 0 3px #FFE1D2">2</span></sc-if>Your tasks</h2>
<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">See all</a>
</div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #E3E6EF; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 700; color: #2B3990; letter-spacing: 0.04em">{{t.tag}}</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.35">{{t.title}}</span>
<span style="font-size: 12px; color: {{t.dueColor}}; font-weight: 500">{{t.due}}</span>
</div>
<sc-if value="{{t.mark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; flex: none; box-shadow: 0 0 0 3px #FFE1D2">3</span></sc-if>
<a href="#" style="height: 44px; padding: 0 14px; border-radius: 10px; background: #E8EAF6; color: #2B3990; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; flex: none">Upload</a>
</div>
</sc-for>
</section>

<section aria-labelledby="rec-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="rec-h" style="margin: 0; font-size: 16px; font-weight: 700"><sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; vertical-align: middle; box-shadow: 0 0 0 3px #FFE1D2">4</span></sc-if>Recent uploads</h2>
<div style="background: #FFFFFF; border: 1px solid #E3E6EF; border-radius: 14px; padding: 4px 14px">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: {{r.border}}">
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 12px; color: #545B73">{{r.when}}</span>
</div>
<span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; flex: none; color: {{r.fg}}; background: {{r.bg}}">{{r.status}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<nav aria-label="App" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6EF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2B3990; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 44px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #545B73; font-size: 11px; font-weight: 500; text-decoration: none; min-height: 44px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>Tasks</a>
<div style="display: flex; justify-content: center; position: relative">
<sc-if value="{{guide}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: -40px; left: -6px; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #C2410C; color: #FFFFFF; font-size: 14px; font-weight: 700; box-shadow: 0 0 0 3px #FFE1D2">5</span></sc-if>
<a href="#" aria-label="Upload evidence" style="width: 60px; height: 60px; margin-top: -26px; border-radius: 50%; background: #2B3990; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(43, 57, 144, 0.35); text-decoration: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</div>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #545B73; font-size: 11px; font-weight: 500; text-decoration: none; min-height: 44px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Uploads</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #545B73; font-size: 11px; font-weight: 500; text-decoration: none; min-height: 44px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"guide":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tasks = [
      { tag: 'NAAC · CRITERION 6', title: 'Upload FDP certificate (ML workshop)', due: 'Due in 3 days', dueColor: '#A15C07' },
      { tag: 'NAAC · CRITERION 3', title: 'Add details of your 2025 journal paper', due: 'Due in 10 days', dueColor: '#545B73' },
      { tag: 'NBA · CRITERION 5', title: 'Upload guest lecture photos and attendance', due: 'Due in 12 days', dueColor: '#545B73' }
    ];
    const recent = [
      { title: 'Seminar report · AI in healthcare', when: 'Today, 9:40 AM', status: 'In review', fg: '#A15C07', bg: '#FDF0DC', border: '1px solid #EEF0F4' },
      { title: 'Course file · CS501', when: 'Yesterday', status: 'Approved', fg: '#0E7068', bg: '#DDF1EE', border: '1px solid #EEF0F4' },
      { title: 'Industry visit photos', when: '6 Oct', status: 'Needs fix', fg: '#B3261E', bg: '#FBE4E2', border: 'none' }
    ];
    const guide = !!this.props.guide;
    return { tasks: tasks.map((t, i) => ({ ...t, mark: guide && i === 0 })), recent, guide };
  }
}
</script>
</body>
</html>
