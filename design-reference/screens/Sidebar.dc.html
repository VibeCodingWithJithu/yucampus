</sc-if>
<sc-if value="{{item.inactive}}" hint-placeholder-val="{{true}}">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #545B73; font-weight: 500; font-size: 14px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
</sc-if>
</li>

</nav>
